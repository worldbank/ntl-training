project:
  type: website
  output-dir: docs
  render:
    - README.md
    - code-setup/rstudio-setup.md
    - code-setup/python-setup.md
    - spatial-blackmarble-training/r-training/r-blackmarble-training.rmd
    - spatial-blackmarble-training/python-training/python-blackmarble-training.md

website:
  title: "Nighttime Lights for Economic Analysis"
  description: "Training materials for using nighttime lights data in economic analysis"
  site-url: "https://worldbank.github.io/ntl-training"
  repo-url: "https://github.com/worldbank/ntl-training"
  
  navbar:
    title: "Monitoring Economies with Nightlights"
    left:
      - href: README.md
        text: Home
      - text: "Code Setup"
        menu:
          - href: code-setup/rstudio-setup.html
            text: "RStudio Setup"
          - href: code-setup/python-setup.html
            text: "Python Setup"
      - text: "Spatial BlackMarble Training"
        menu:
          - href: spatial-blackmarble-training/r-training/r-blackmarble-training.html
            text: "R Training"
          - href: spatial-blackmarble-training/python-training/python-blackmarble-training.html
            text: "Python Training"
    right:
      - icon: github
        href: https://github.com/worldbank/ntl-training
        text: GitHub
    
  sidebar:
    - title: "Home"
      contents:
        - text: "Welcome"
          href: README.md
    
    - title: "Code Setup"
      contents:
        - text: "RStudio Setup"
          href: code-setup/rstudio-setup.html
        - text: "Python Setup"
          href: code-setup/python-setup.html
    
    - title: "Spatial BlackMarble Training"
      contents:
        - text: "R Training"
          href: spatial-blackmarble-training/r-training/r-blackmarble-training.html
        - text: "Python Training"
          href: spatial-blackmarble-training/python-training/python-blackmarble-training.html

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    embed-resources: false
    html-math-method: katex
    
execute:
  freeze: auto  # Use frozen results when available
  eval: true    # Set to false to skip all execution
  echo: true    # Show code by default
  cache: true   # Enable caching globally