name: Preview Branch

on:
  push:
    branches-ignore: 
      - main
      - gh-pages

jobs:
  preview:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true 
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::sf
            any::terra
            any::leaflet
            any::leaflet.providers
            any::ggplot2
            any::dplyr
            any::tidyverse
            any::lubridate
            any::here
            any::usethis
            any::blackmarbler
            any::osmdata
            any::geodata
            any::exactextractr
            any::readr
            any::readxl
            any::janitor
            any::scales
            any::viridis
            any::RColorBrewer
            any::DT
            any::plotly
            any::htmlwidgets
            any::ggpubr
            any::tidyterra
            any::gtools
            any::WDI
            any::kableExtra
            any::countrycode
            any::haven
            any::ggnewscale
            any::h3jsr
            any::fixest
          cache-version: 2

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          destination_dir: preview/${{ github.ref_name }}
          keep_files: true

      - name: Output preview URL
        run: |
          echo "🚀 Preview deployed successfully!"
          echo "📖 Preview URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/${{ github.ref_name }}/"
          echo "::notice title=Preview Deployed::Preview available at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/${{ github.ref_name }}/"