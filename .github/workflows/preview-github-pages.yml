name: Preview Branch

on:
  push:
    branches-ignore: 
      - main
      - gh-pages

jobs:
  preview:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true 
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::sf
            any::terra
            any::leaflet
            any::leaflet.providers
            any::ggplot2
            any::dplyr
            any::tidyverse
            any::lubridate
            any::here
            any::usethis
            any::blackmarbler
            any::osmdata
            any::geodata
            any::exactextractr
            any::readr
            any::readxl
            any::janitor
            any::scales
            any::viridis
            any::RColorBrewer
            any::DT
            any::plotly
            any::htmlwidgets
            any::ggpubr
            any::tidyterra
            any::gtools
            any::WDI
            any::kableExtra
            any::countrycode
            any::haven
            any::ggnewscale
            any::h3jsr
            any::fixest
          cache-version: 2

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Verify docs directory
        run: |
          echo "Checking docs directory..."
          ls -la docs/
          echo "Docs directory size:"
          du -sh docs/
          echo "Sample files:"
          find docs/ -name "*.html" | head -5

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './docs'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview for ${{ github.ref_name }}: ${{ github.event.head_commit.message }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          alias: deploy-preview-${{ github.ref_name }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

      - name: Output preview info
        run: |
          echo "🚀 Preview deployed successfully!"
          echo "📖 Preview will be available via Netlify deploy preview"
          echo "🔗 Check the commit comments or PR comments for the preview URL"
          echo "::notice title=Preview Deployed::Netlify deploy preview created for branch ${{ github.ref_name }}"